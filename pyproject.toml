[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-bot"
version = "0.1.0"
description = "Safe, analysis-only AI trading analyst bot (no real trades)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2.40",
    "ta>=0.11.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "black>=24.0",
    "mypy>=1.8",
]

[project.scripts]
ai-trading-bot = "src.main:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # line length is governed by black

[tool.mypy]
files = ["src"]
ignore_missing_imports = true
warn_redundant_casts = true
no_implicit_optional = true

# numpy/pandas ship type stubs that use PEP 695 `type` statements (valid only
# on Python 3.12+). They are already treated as untyped via
# ignore_missing_imports, so skip following them to keep mypy working
# regardless of the interpreter version running it.
[[tool.mypy.overrides]]
module = ["numpy.*", "pandas.*"]
follow_imports = "skip"
